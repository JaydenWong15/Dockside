<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dockside Paddle Co. · Grand Canal Dock Watersports</title>
  <style>
    :root {
      --ocean-deep: #062c43;
      --ocean-mid: #054569;
      --lagoon: #0096c7;
      --aqua: #48cae4;
      --sun-gold: #ffb703;
      --sun-warm: #fb8500;
      --foam: #f8fdff;
      --card-bg: rgba(255, 255, 255, 0.94);
      --glass-border: rgba(255, 255, 255, 0.65);
      --text-main: #0f172a;
      --text-muted: #475569;
      --imessage-blue: linear-gradient(135deg, #007aff, #005bb5);
      --imessage-gray: #e9eef5;
      --success: #0d9488;
      --warning: #e11d48;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #dff6ff 0%, #b8e8fc 45%, #8ecae6 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Animated Sun & Sky Backdrop */
    .sky-scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sun-orb {
      position: absolute;
      top: -60px;
      right: 8%;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3b0 0%, #ffb703 55%, rgba(251, 133, 0, 0) 75%);
      filter: blur(2px);
      animation: sunPulse 8s ease-in-out infinite alternate;
      opacity: 0.85;
    }

    @keyframes sunPulse {
      0% { transform: scale(1) translateY(0); opacity: 0.8; }
      100% { transform: scale(1.1) translateY(8px); opacity: 0.95; }
    }

    /* Animated Multi-Layer Ocean Waves at Bottom */
    .ocean-waves {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 190px;
      z-index: 0;
      pointer-events: none;
    }

    .waves-svg {
      width: 100%;
      height: 100%;
    }

    .parallax > use {
      animation: waveMove 25s cubic-bezier(.55,.5,.45,.5) infinite;
    }
    .parallax > use:nth-child(1) {
      animation-delay: -2s;
      animation-duration: 9s;
    }
    .parallax > use:nth-child(2) {
      animation-delay: -3s;
      animation-duration: 14s;
    }
    .parallax > use:nth-child(3) {
      animation-delay: -4s;
      animation-duration: 19s;
    }
    .parallax > use:nth-child(4) {
      animation-delay: -5s;
      animation-duration: 26s;
    }

    @keyframes waveMove {
      0% { transform: translate3d(-90px, 0, 0); }
      100% { transform: translate3d(85px, 0, 0); }
    }

    /* Drifting Kayak Silhouette */
    .floating-kayak {
      position: fixed;
      bottom: 48px;
      left: 12%;
      z-index: 1;
      pointer-events: none;
      animation: kayakBob 6s ease-in-out infinite alternate;
      opacity: 0.85;
    }

    @keyframes kayakBob {
      0% { transform: translateY(0px) rotate(-2deg) translateX(0); }
      50% { transform: translateY(-7px) rotate(2deg) translateX(18px); }
      100% { transform: translateY(2px) rotate(-1deg) translateX(35px); }
    }

    /* Top Navigation / Marina Header */
    header {
      position: relative;
      z-index: 10;
      background: rgba(6, 44, 67, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.9rem 1.75rem;
      box-shadow: 0 8px 32px rgba(6, 44, 67, 0.18);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--lagoon), var(--aqua));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 150, 199, 0.45);
      flex-shrink: 0;
    }

      font-size: 1.35rem;
      font-weight: 700;
